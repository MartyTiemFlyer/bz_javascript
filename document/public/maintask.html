<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📋 Менеджер задач</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #4F46E5;
            font-size: 2em;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .subtitle {
            color: #6b7280;
            margin-bottom: 25px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        .input-group input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            transition: border 0.3s;
        }
        .input-group input:focus {
            border-color: #4F46E5;
        }
        .btn {
            padding: 12px 24px;
            background: #4F46E5;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn:hover {
            background: #4338CA;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }
        .btn-delete {
            background: #EF4444;
            padding: 6px 12px;
            font-size: 14px;
        }
        .btn-delete:hover {
            background: #DC2626;
        }
        .task-list {
            list-style: none;
        }
        .task-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            background: #f9fafb;
            border-radius: 10px;
            margin-bottom: 8px;
            transition: all 0.3s;
            animation: slideIn 0.3s ease;
        }
        .task-item:hover {
            background: #f3f4f6;
            transform: translateX(5px);
        }
        .task-title {
            font-size: 16px;
            color: #1f2937;
        }
        .task-time {
            font-size: 12px;
            color: #9ca3af;
            margin-left: 12px;
        }
        .empty {
            text-align: center;
            color: #9ca3af;
            padding: 40px 0;
            font-size: 18px;
        }
        .stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-top: 2px solid #f3f4f6;
            margin-top: 20px;
            color: #6b7280;
            font-size: 14px;
        }
        .status-badge {
            background: #10B981;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 Менеджер задач</h1>
        <p class="subtitle">Добавляйте и управляйте своими задачами</p>

        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Введите новую задачу..." />
            <button class="btn" onclick="addTask()">➕ Добавить</button>
        </div>

        <div id="taskList" class="task-list">
            <div class="empty">Загрузка задач...</div>
        </div>

        <div class="stats">
            <span id="taskCount">Всего: 0 задач</span>
            <span class="status-badge">✅ Система работает</span>
        </div>
    </div>

    <script>
        const API_URL = '/tasks';

        // Загрузить задачи при открытии страницы
        document.addEventListener('DOMContentLoaded', loadTasks);

        // Добавить задачу по Enter
        document.getElementById('taskInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') addTask();
        });

        async function loadTasks() {
            try {
                const response = await fetch(API_URL);
                const tasks = await response.json();
                renderTasks(tasks);
            } catch (error) {
                console.error('Ошибка загрузки:', error);
                document.getElementById('taskList').innerHTML = 
                    '<div class="empty">❌ Ошибка загрузки задач</div>';
            }
        }

        function renderTasks(tasks) {
            const container = document.getElementById('taskList');
            const count = document.getElementById('taskCount');

            if (tasks.length === 0) {
                container.innerHTML = '<div class="empty">🎯 Нет задач. Добавьте первую!</div>';
                count.textContent = 'Всего: 0 задач';
                return;
            }

            container.innerHTML = tasks.map(task => `
                <div class="task-item">
                    <div>
                        <span class="task-title">${escapeHtml(task.title)}</span>
                        <span class="task-time">${new Date(task.created_at).toLocaleString('ru-RU')}</span>
                    </div>
                    <button class="btn btn-delete" onclick="deleteTask(${task.id})">🗑️</button>
                </div>
            `).join('');

            count.textContent = `Всего: ${tasks.length} задач`;
        }

        async function addTask() {
            const input = document.getElementById('taskInput');
            const title = input.value.trim();

            if (!title) {
                alert('Введите название задачи');
                return;
            }

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title })
                });

                if (response.ok) {
                    input.value = '';
                    await loadTasks();
                } else {
                    alert('Ошибка при добавлении задачи');
                }
            } catch (error) {
                console.error('Ошибка:', error);
                alert('Ошибка при добавлении задачи');
            }
        }

        async function deleteTask(id) {
            if (!confirm('Удалить задачу?')) return;

            try {
                const response = await fetch(`${API_URL}/${id}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    await loadTasks();
                } else {
                    alert('Ошибка при удалении задачи');
                }
            } catch (error) {
                console.error('Ошибка:', error);
                alert('Ошибка при удалении задачи');
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
